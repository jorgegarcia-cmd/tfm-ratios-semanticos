titulo_es: "Contextualización semántica de estados financieros para el cálculo e interpretación fiable de ratios en el sector financiero: un prototipo basado en ontologías y modelos de lenguaje"
titulo_en: "Semantic contextualization of financial statements for the reliable calculation and interpretation of financial ratios in the financial sector: an ontology- and LLM-based prototype"
autor: "Jorge García"
tutor: "Prof. D. Víctor Lechuga"
curso: "Curso académico 2026-2027"
resumen: >-
  Los ratios financieros que publican bancos y aseguradoras no son directamente comparables. Cada entidad define a su manera sus medidas alternativas de rendimiento y etiqueta con elementos propios una parte de sus cifras, incluso en el formato electrónico único europeo (ESEF). Este trabajo diseña y valida una herramienta de contextualización semántica que relaciona cada dato con un concepto financiero canónico, calcula los ratios de forma determinista y conserva la traza de cada cifra hasta su origen. Se aplica a los informes ESEF de 2025 de Santander, BBVA, CaixaBank, Sabadell, Mapfre y Línea Directa. Un tercio de sus cifras usa extensiones propias, y el ROE publicado se calcula con al menos cuatro bases de patrimonio distintas, que llegan a alterar la clasificación de las entidades. El prototipo calcula 64 de los 72 ratios posibles. En 26 de las 39 comparaciones con los ratios publicados la diferencia es inferior a medio punto, y el resto se explica por diferencias de definición o de perímetro. Un modelo de lenguaje permite consultar los resultados en lenguaje natural sin generar las cifras, lo que hace las respuestas verificables.
palabras_clave: "ratios financieros; XBRL; medidas alternativas de rendimiento; ontologías; modelos de lenguaje"
abstract: >-
  The financial ratios published by banks and insurers are not directly comparable. Each entity defines its alternative performance measures in its own way and tags part of its figures with its own elements, even in the European Single Electronic Format (ESEF). This thesis designs and validates a semantic contextualization tool that maps each data point to a canonical financial concept, computes ratios deterministically and keeps the trace of every figure back to its source. It is applied to the 2025 ESEF reports of Santander, BBVA, CaixaBank, Sabadell, Mapfre and Línea Directa. One third of their figures use entity-specific extensions, and the published ROE is computed on at least four different equity bases, which can change how the entities rank. The prototype computes 64 of the 72 possible ratios. In 26 of the 39 comparisons with published ratios the difference is below half a percentage point, and the rest is explained by differences in definition or scope. A language model lets users query the results in natural language without generating the figures, which makes the answers verifiable.
keywords: "financial ratios; XBRL; alternative performance measures; ontologies; large language models"
